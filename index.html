<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Sales Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f8f8f6; --bg2: #fff; --bg3: #f1efe8;
      --text: #1a1a18; --text2: #73726c; --text3: #888780;
      --border: rgba(0,0,0,0.1); --border2: rgba(0,0,0,0.06);
      --blue: #185FA5; --green: #3B6D11; --purple: #534AB7; --pink: #993556;
      --blue-dark: #27500A; --green-dark: #72243E;
      --ok-bg: #EAF3DE; --ok-text: #27500A;
      --warn-bg: #FAEEDA; --warn-text: #633806;
      --err-bg: #FCEBEB; --err-text: #791F1F;
      --radius: 8px; --radius-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a18; --bg2: #252523; --bg3: #222220;
        --text: #e8e6de; --text2: #9c9a92; --text3: #73726c;
        --border: rgba(255,255,255,0.1); --border2: rgba(255,255,255,0.06);
      }
    }

    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      padding: 1rem; min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    .container { max-width: 960px; margin: 0 auto; }

    .header {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 8px;
      margin-bottom: 1.25rem;
    }
    .header-title { font-size: clamp(16px, 4vw, 20px); font-weight: 500; }
    .header-sub   { font-size: 12px; color: var(--text3); margin-top: 2px; }

    .btn {
      font-size: 13px; cursor: pointer;
      background: var(--bg2); color: var(--text);
      border: 0.5px solid var(--border); border-radius: var(--radius);
      padding: 8px 14px; white-space: nowrap;
      -webkit-appearance: none; touch-action: manipulation;
      min-height: 36px; display: flex; align-items: center; gap: 6px;
    }
    .btn:active { opacity: 0.7; }

    .error-box {
      background: var(--err-bg); color: var(--err-text);
      border-radius: var(--radius); padding: 10px 14px;
      font-size: 13px; margin-bottom: 1rem; display: none;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px; margin-bottom: 1.25rem;
    }
    @media (min-width: 480px) { .metrics { grid-template-columns: repeat(4, 1fr); } }

    .metric {
      background: var(--bg3); border-radius: var(--radius);
      padding: 12px; min-width: 0;
    }
    .metric-label { font-size: 12px; color: var(--text2); margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
    .metric-value { font-size: clamp(18px, 4vw, 24px); font-weight: 500; }
    .metric-sub   { font-size: 11px; color: var(--text3); margin-top: 2px; }

    .grid-2 {
      display: grid; grid-template-columns: 1fr;
      gap: 12px; margin-bottom: 1.25rem;
    }
    @media (min-width: 600px) { .grid-2 { grid-template-columns: 1fr 1fr; } }

    .card {
      background: var(--bg2); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 1rem 1.25rem; min-width: 0;
    }

    .section-title {
      font-size: 11px; font-weight: 500; color: var(--text3);
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px;
    }

    .tab-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .tab-btn {
      font-size: 12px; padding: 5px 12px; border-radius: 99px;
      border: 0.5px solid var(--border); cursor: pointer;
      background: none; color: var(--text);
      min-height: 30px; touch-action: manipulation;
      -webkit-appearance: none;
    }
    .tab-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

    .bar-row { display: flex; align-items: center; gap: 8px; }
    .bar-label { font-size: 12px; font-weight: 500; width: 36px; flex-shrink: 0; }
    .bar-bg { background: var(--border); border-radius: 4px; height: 6px; flex: 1; min-width: 0; }
    .bar-fill { height: 6px; border-radius: 4px; transition: width 0.3s; }
    .bar-val { font-size: 12px; color: var(--text3); min-width: 60px; text-align: right; flex-shrink: 0; }

    .divider { border: none; border-top: 0.5px solid var(--border2); margin: 12px 0; }

    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 520px; }
    th {
      font-size: 11px; font-weight: 500; color: var(--text3);
      text-align: left; padding: 4px 8px;
      border-bottom: 0.5px solid var(--border); white-space: nowrap;
    }
    td { padding: 8px 8px; border-bottom: 0.5px solid var(--border2); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }

    .badge {
      display: inline-block; font-size: 11px;
      padding: 2px 8px; border-radius: 99px; font-weight: 500; white-space: nowrap;
    }
    .badge-ok   { background: var(--ok-bg);   color: var(--ok-text); }
    .badge-warn { background: var(--warn-bg);  color: var(--warn-text); }

    .filter-row {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 10px; gap: 8px; flex-wrap: wrap;
    }

    select {
      font-size: 13px; padding: 6px 10px;
      border-radius: var(--radius); border: 0.5px solid var(--border);
      background: var(--bg2); color: var(--text);
      -webkit-appearance: none; appearance: none;
      min-height: 34px; cursor: pointer;
    }

    .charts-grid {
      display: grid; grid-template-columns: 1fr;
      gap: 12px; margin-bottom: 1.25rem;
    }
    @media (min-width: 600px) { .charts-grid { grid-template-columns: 1fr 1fr; } }

    .chart-wrap { position: relative; height: 220px; }

    .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; font-size: 12px; color: var(--text2); }
    .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

    .spinner {
      display: inline-block; width: 13px; height: 13px;
      border: 2px solid var(--border); border-top-color: var(--blue);
      border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty { font-size: 13px; color: var(--text3); padding: 8px 0; text-align: center; }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div>
      <div class="header-title">Sales Dashboard</div>
      <div class="header-sub" id="last-updated">Loading...</div>
    </div>
    <button class="btn" onclick="loadData()" id="refresh-btn">
      <i class="ti ti-refresh" aria-hidden="true"></i>
      <span id="refresh-label">Refresh</span>
    </button>
  </div>

  <div class="error-box" id="error-msg"></div>

  <div class="metrics">
    <div class="metric">
      <div class="metric-label"><i class="ti ti-receipt" aria-hidden="true"></i> Orders</div>
      <div class="metric-value" id="m-orders">—</div>
      <div class="metric-sub" id="m-orders-sub"></div>
    </div>
    <div class="metric">
      <div class="metric-label"><i class="ti ti-stack" aria-hidden="true"></i> Shirts</div>
      <div class="metric-value" id="m-shirts">—</div>
      <div class="metric-sub" id="m-shirts-sub"></div>
    </div>
    <div class="metric">
      <div class="metric-label"><i class="ti ti-currency-baht" aria-hidden="true"></i> Revenue</div>
      <div class="metric-value" id="m-revenue">—</div>
      <div class="metric-sub" id="m-revenue-sub"></div>
    </div>
    <div class="metric">
      <div class="metric-label"><i class="ti ti-circle-check" aria-hidden="true"></i> Verified</div>
      <div class="metric-value" id="m-verified">—</div>
      <div class="metric-sub" id="m-verified-sub"></div>
    </div>
  </div>

  <div class="grid-2">

    <div class="card">
      <div class="section-title">Size breakdown</div>
      <div class="tab-row">
        <button class="tab-btn active" onclick="setSizeTab('all')"    id="tab-all">All</button>
        <button class="tab-btn"        onclick="setSizeTab('male')"   id="tab-male">ชาย</button>
        <button class="tab-btn"        onclick="setSizeTab('female')" id="tab-female">หญิง</button>
      </div>
      <div id="size-list" style="display:flex;flex-direction:column;gap:8px;"></div>
    </div>

    <div class="card">
      <div class="section-title">Delivery method</div>
      <div id="delivery-list" style="display:flex;flex-direction:column;gap:8px;"></div>
      <hr class="divider">
      <div class="section-title">Gender split</div>
      <div id="gender-list" style="display:flex;flex-direction:column;gap:8px;"></div>
    </div>

  </div>

  <div class="card" style="margin-bottom:1.25rem;">
    <div class="filter-row">
      <div class="section-title" style="margin-bottom:0;">Recent orders</div>
      <select id="filter-delivery" onchange="applyFilter()">
        <option value="">All delivery</option>
        <option value="คุณภาพน้ำ">คุณภาพน้ำ</option>
        <option value="สำนักงาน">สำนักงานใหญ่</option>
        <option value="ไปรษณีย์">ไปรษณีย์</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Date</th><th>Name</th><th>Gender</th><th>Size</th>
          <th>Qty</th><th>Price</th><th>Delivery</th><th>Status</th>
        </tr></thead>
        <tbody id="orders-tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="charts-grid">
    <div class="card">
      <div class="section-title">Qty by size</div>
      <div class="chart-wrap">
        <canvas id="sizeChart" role="img" aria-label="Bar chart of shirt quantity by size"></canvas>
      </div>
    </div>
    <div class="card">
      <div class="section-title">Revenue by tier</div>
      <div class="legend">
        <span style="display:flex;align-items:center;gap:4px;"><span class="legend-dot" style="background:#185FA5;"></span>Normal SS–2XL</span>
        <span style="display:flex;align-items:center;gap:4px;"><span class="legend-dot" style="background:#3B6D11;"></span>Big 3XL–7XL</span>
      </div>
      <div class="chart-wrap" style="height:192px;">
        <canvas id="tierChart" role="img" aria-label="Donut chart revenue by size tier"></canvas>
      </div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
  const SHEET_ID  = '1c2J0WExPWB0mHY3HEU1kdt70b81tZ6BiGjsp8E05S4k';
  const API_KEY   = 'AIzaSyA6gnaCXc_CVZCd_zRJP2MQxqy3hkumUmU';
  const SHEET_TAB = 'ชีต1';
  const BIG_SIZES = ['3XL','4XL','5XL','6XL','7XL'];

  let allRows = [], sizeChartInst, tierChartInst;
  let sizeData = { all:{}, male:{}, female:{} };
  let currentSizeTab = 'all';

  function fmt(n) { return Math.round(n).toLocaleString(); }

  async function loadData() {
    const btn   = document.getElementById('refresh-btn');
    const label = document.getElementById('refresh-label');
    label.innerHTML = '<span class="spinner"></span>';
    btn.disabled = true;
    document.getElementById('error-msg').style.display = 'none';

    try {
      const url  = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(SHEET_TAB)}?key=${API_KEY}`;
      const res  = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      allRows = (json.values || []).slice(1);
      render(allRows);
      document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    } catch(e) {
      const el = document.getElementById('error-msg');
      el.textContent = 'Cannot load: ' + e.message + ' — check SHEET_ID, API_KEY, and sheet name';
      el.style.display = 'block';
      document.getElementById('last-updated').textContent = 'Failed to load';
    }

    label.textContent = 'Refresh';
    btn.disabled = false;
  }

  function render(rows) {
    let totalShirts=0, totalRevenue=0, verifiedCount=0, unverifiedCount=0;
    const deliveryMap={}, genderMap={male:0, female:0};
    const uniqueOrders = new Set();
    sizeData = { all:{}, male:{}, female:{} };

    rows.forEach(r => {
      const qty      = parseInt(r[6])   || 0;
      const grand    = parseFloat(r[11])|| 0;
      const size     = (r[5]  || '').toUpperCase().trim();
      const gender   = (r[4]  || '').trim();
      const delivery = (r[9]  || '').trim();
      const status   = (r[13] || '').trim();

      totalShirts += qty;
      if (grand > 0) { totalRevenue += grand; uniqueOrders.add((r[1]||'') + r[0]); }
      if (status.includes('ตรง')) verifiedCount++;
      else if (status) unverifiedCount++;

      if (size) {
        sizeData.all[size]    = (sizeData.all[size]    || 0) + qty;
        if (gender === 'ชาย')  sizeData.male[size]   = (sizeData.male[size]   || 0) + qty;
        if (gender === 'หญิง') sizeData.female[size] = (sizeData.female[size] || 0) + qty;
      }

      if (delivery) {
        const k = delivery.includes('คุณภาพน้ำ') ? 'คุณภาพน้ำ'
                : delivery.includes('สำนักงาน')  ? 'สำนักงานใหญ่'
                : delivery.includes('ไปรษณีย์')  ? 'ไปรษณีย์' : delivery;
        deliveryMap[k] = (deliveryMap[k] || 0) + qty;
      }

      if (gender === 'ชาย')  genderMap.male   += qty;
      if (gender === 'หญิง') genderMap.female += qty;
    });

    document.getElementById('m-orders').textContent    = uniqueOrders.size;
    document.getElementById('m-orders-sub').textContent = rows.length + ' line items';
    document.getElementById('m-shirts').textContent    = fmt(totalShirts);
    document.getElementById('m-shirts-sub').textContent = 'across all sizes';
    document.getElementById('m-revenue').textContent   = '฿' + fmt(totalRevenue);
    document.getElementById('m-revenue-sub').textContent = 'confirmed orders';
    document.getElementById('m-verified').textContent  = verifiedCount;
    document.getElementById('m-verified-sub').textContent = unverifiedCount + ' pending';

    renderSizeList();
    renderBars('delivery-list', deliveryMap, '#534AB7', '#185FA5');

    const totG = (genderMap.male + genderMap.female) || 1;
    document.getElementById('gender-list').innerHTML = [
      ['ชาย', genderMap.male,   '#185FA5'],
      ['หญิง', genderMap.female, '#993556']
    ].map(([l, v, c]) => barRow(l, v, Math.round(v/totG*100), Math.max(genderMap.male, genderMap.female)||1, c)).join('');

    renderTable(rows);
    renderCharts(rows);
  }

  function barRow(label, qty, pct, maxQ, color) {
    return `<div class="bar-row">
      <span class="bar-label">${label}</span>
      <div class="bar-bg"><div class="bar-fill" style="width:${Math.round(qty/maxQ*100)}%;background:${color}"></div></div>
      <span class="bar-val">${qty} (${pct}%)</span>
    </div>`;
  }

  function renderBars(elId, map, color1, color2) {
    const total = Object.values(map).reduce((a,b)=>a+b,0)||1;
    const maxQ  = Math.max(...Object.values(map),1);
    document.getElementById(elId).innerHTML = Object.entries(map)
      .map(([k,v]) => barRow(k, v, Math.round(v/total*100), maxQ, color1)).join('') ||
      `<div class="empty">No data</div>`;
  }

  function setSizeTab(tab) {
    currentSizeTab = tab;
    ['all','male','female'].forEach(t => {
      document.getElementById('tab-'+t).classList.toggle('active', t===tab);
    });
    renderSizeList();
  }

  function renderSizeList() {
    const map       = sizeData[currentSizeTab];
    const total     = Object.values(map).reduce((a,b)=>a+b,0)||1;
    const maxQ      = Math.max(...Object.values(map),1);
    const sizeOrder = ['SS','S','M','L','XL','2XL','3XL','4XL','5XL','6XL','7XL'];
    const sizes     = sizeOrder.filter(s => map[s]);
    const baseColor = currentSizeTab==='female' ? '#993556' : '#185FA5';
    const bigColor  = currentSizeTab==='female' ? '#72243E' : '#27500A';

    document.getElementById('size-list').innerHTML = sizes.map(s => {
      const q   = map[s];
      const pct = Math.round(q/total*100);
      return barRow(s, q, pct, maxQ, BIG_SIZES.includes(s) ? bigColor : baseColor);
    }).join('') || `<div class="empty">No data</div>`;
  }

  function applyFilter() {
    const val = document.getElementById('filter-delivery').value;
    renderTable(val ? allRows.filter(r=>(r[9]||'').includes(val)) : allRows);
  }

function parseThaiDate(str) {
  if (!str) return null;
  try {
    // format จริงคือ M/D/YY เช่น 5/9/26
    const clean = str.split(',')[0].trim();
    const d = new Date(clean);
    return isNaN(d.getTime()) ? null : d;
  } catch(e) {
    return null;
  }
}

function renderTable(rows) {

  function renderTable(rows) {
    document.getElementById('orders-tbody').innerHTML = [...rows].reverse().slice(0,30).map(r => {
      const status    = (r[13]||'').trim();
      const badgeClass= status.includes('ตรง') ? 'badge-ok' : status ? 'badge-warn' : '';
      const badgeText = status.includes('ตรง') ? 'Verified' : status ? 'Pending' : '—';
      let date = '—';
      try {
        const d = parseThaiDate(r[0]);
        if (d) date = d.toLocaleDateString('th-TH', { day:'numeric', month:'short' });
      } catch(e){}
      return `<tr>
        <td style="color:var(--text3);white-space:nowrap">${date}</td>
        <td style="font-weight:500;white-space:nowrap">${r[1]||'—'}</td>
        <td>${r[4]||'—'}</td>
        <td style="font-family:monospace">${r[5]||'—'}</td>
        <td style="text-align:center">${r[6]||'—'}</td>
        <td style="white-space:nowrap">฿${fmt(parseFloat(r[8])||0)}</td>
        <td style="font-size:12px;color:var(--text3);white-space:nowrap">${(r[9]||'').replace('รับที่','').replace('(+50 บาท)','').trim()}</td>
        <td><span class="badge ${badgeClass}">${badgeText}</span></td>
      </tr>`;
    }).join('') || '<tr><td colspan="8" style="text-align:center;color:var(--text3);padding:1.5rem">No data</td></tr>';
  }

  function renderCharts(rows) {
    if (sizeChartInst) sizeChartInst.destroy();
    if (tierChartInst) tierChartInst.destroy();

    const isDark    = matchMedia('(prefers-color-scheme: dark)').matches;
    const textColor = isDark ? '#73726c' : '#888780';
    const gridColor = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
    const sizeOrder = ['SS','S','M','L','XL','2XL','3XL','4XL','5XL','6XL','7XL'];
    const sizes     = sizeOrder.filter(s => sizeData.all[s]);

    sizeChartInst = new Chart(document.getElementById('sizeChart'), {
      type: 'bar',
      data: {
        labels: sizes,
        datasets: [{
          data: sizes.map(s => sizeData.all[s]),
          backgroundColor: sizes.map(s => BIG_SIZES.includes(s) ? '#3B6D11' : '#185FA5'),
          borderRadius: 4
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: textColor, font:{size:11} }, grid: { color: gridColor } },
          y: { ticks: { color: textColor, font:{size:11} }, grid: { color: gridColor }, beginAtZero: true }
        }
      }
    });

    let normalRev=0, bigRev=0;
    rows.forEach(r => {
      const s = (r[5]||'').toUpperCase().trim(), t = parseFloat(r[8])||0;
      BIG_SIZES.includes(s) ? bigRev+=t : normalRev+=t;
    });
    const total = (normalRev+bigRev)||1;

    tierChartInst = new Chart(document.getElementById('tierChart'), {
      type: 'doughnut',
      data: {
        labels: ['Normal SS–2XL','Big 3XL–7XL'],
        datasets: [{
          data: [normalRev, bigRev],
          backgroundColor: ['#185FA5','#3B6D11'],
          borderWidth: 0, hoverOffset: 4
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '65%',
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => ' ฿'+fmt(ctx.raw)+' ('+Math.round(ctx.raw/total*100)+'%)' } }
        }
      }
    });
  }

  loadData();
  setInterval(loadData, 60000);
</script>
</body>
</html>
